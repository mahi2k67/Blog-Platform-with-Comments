<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <h1>💬 Comments</h1>

    <div class="card">

        <div id="comments"></div>

        <div class="comment-box">

            <input
            id="comment"
            placeholder="Write a comment...">

            <button onclick="addComment()">
                Add Comment
            </button>

            <br><br>

            <a href="index.html">
                <button>
                    Back to Blogs
                </button>
            </a>

        </div>

    </div>

</div>

<script>

const postId =
new URLSearchParams(
window.location.search
).get("id");

async function loadComments(){

    try{

        const response = await fetch(
            `http://localhost:5000/comments/${postId}`
        );

        const comments =
        await response.json();

        let output = "";

        if(comments.length === 0){

            output = `
            <div class="comment">
                No comments yet.
            </div>
            `;
        }

        comments.forEach(c => {

            output += `
            <div class="comment">
                💬 ${c.comment}
            </div>
            `;
        });

        document.getElementById("comments")
        .innerHTML = output;

    }
    catch(error){

        console.log(error);

        document.getElementById("comments")
        .innerHTML = `
        <div class="comment">
            Unable to load comments.
        </div>
        `;
    }
}

async function addComment(){

    const comment =
    document.getElementById("comment")
    .value;

    if(comment.trim() === ""){

        alert("Enter a comment");
        return;
    }

    await fetch(
        "http://localhost:5000/comments",
        {
            method:"POST",
            headers:{
                "Content-Type":
                "application/json"
            },
            body:JSON.stringify({
                postId,
                comment
            })
        }
    );

    document.getElementById("comment")
    .value = "";

    loadComments();
}

loadComments();

</script>

</body>
</html>
